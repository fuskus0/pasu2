name: Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
env:
  PLAY_VERSION: "2026.09.03-6"
  PLAY_SHA256: "5770f4778788b003b00c082497b4b4578745f2d57756a050a7d47f3a1eed730a"
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Descargar motor y verificar sha256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release download "v$PLAY_VERSION" -R geklactus/play-browser -p '*.tar.gz' -O motor.tar.gz
          echo "$PLAY_SHA256  motor.tar.gz" | sha256sum -c -
          tar -xzf motor.tar.gz --strip-components=1 -C emulator
          rm -f motor.tar.gz
          ls emulator
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: d
        uses: actions/deploy-pages@v4
